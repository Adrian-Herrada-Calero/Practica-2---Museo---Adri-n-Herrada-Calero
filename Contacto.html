        <h2>Contáctanos</h2>
        <form action="#" method="post">
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" placeholder="Tu nombre" required></br>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" placeholder="Tu correo" required></br>

        <label for="subject">Asunto:</label>
        <input type="text" id="subject" name="subject" placeholder="Asunto del mensaje"></br>

        <label for="message">Mensaje:</label>
        <textarea id="message" name="message" placeholder="Escribe tu mensaje aquí..." rows="5" required></textarea></br>

        <button type="submit">Enviar</button>
    </form>
